<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Aryan Patil - Full Stack Developer Portfolio. MERN stack expert building scalable web applications."
    />
    <meta name="keywords" content="Full Stack Developer, MERN Stack, React, Node.js, MongoDB, Express, JavaScript, Portfolio" />
    <meta name="author" content="Aryan Patil" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Aryan Patil - Full Stack Developer" />
    <meta property="og:description" content="Full-stack engineer with hands-on experience building MERN stack applications." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aryanpatil.dev" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aryan Patil - Full Stack Developer" />
    <meta name="twitter:description" content="Full-stack engineer with hands-on experience building MERN stack applications." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Aryan Patil</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts - Optional (you can remove if not needed) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      /* Fallback styles while React loads */
      .loading-fallback {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 40px; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>This portfolio requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    
    <div id="root">
      <!-- Loading fallback while React loads -->
      <div class="loading-fallback">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </body>
</html>
